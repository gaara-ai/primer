<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Primer — Reading Buddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="sky">
    <span class="float sun">☀️</span>
    <span class="float c1">☁️</span>
    <span class="float c2">☁️</span>
    <span class="float c3">🎈</span>
    <span class="float c4">🦋</span>
  </div>
  <div id="confetti"></div>
  <div id="app">
    <header>
      <h1>📚 Reading Buddy</h1>
      <div id="stars" title="Stars earned">⭐ <span id="star-count">0</span></div>
    </header>

    <!-- Story picker -->
    <section id="picker" class="screen">
      <div id="picker-buddy">
        <div class="picker-face">🐘</div>
        <div class="picker-bubble">Hi! I'm Gaara! Pick a story and read with me!</div>
      </div>
      <button id="abc-btn">🔤 ABC Letters <span class="level">Start here — A to Z with pictures!</span></button>
      <h2>Pick a story!</h2>
      <div id="story-list"></div>
      <p class="hint" id="support-warning" hidden>
        ⚠️ Speech recognition needs Chrome or Edge.
      </p>
    </section>

    <!-- Alphabet grid -->
    <section id="abc" class="screen" hidden>
      <h2>🔤 Letter Land</h2>
      <p class="hint" id="abc-progress"></p>
      <div id="abc-grid"></div>
      <button id="abc-back" class="secondary">⬅ Back</button>
    </section>

    <!-- Single letter card -->
    <section id="letter" class="screen" hidden>
      <div id="letter-card">
        <div id="letter-big"></div>
        <div id="letter-emoji"></div>
        <div id="letter-word"></div>
      </div>
      <div class="row">
        <button id="letter-prev" class="secondary">⬅ Back</button>
        <button id="letter-hear" class="secondary">🔊 Hear it</button>
        <button id="letter-next" class="secondary">Next ➜</button>
      </div>
      <div class="row">
        <button id="letter-grid-btn" class="secondary">All letters</button>
      </div>
    </section>

    <!-- Reading screen -->
    <section id="reader" class="screen" hidden>
      <div id="progress-dots"></div>
      <div id="buddy">
        <div id="buddy-face">🐘</div>
        <div id="buddy-bubble" hidden></div>
      </div>
      <div id="sentence"></div>
      <p class="hint tap-hint">Tap any word to hear it 🔉</p>
      <button id="mic" type="button">🎤 Tap, then read aloud</button>
      <p class="hint" id="status">Tap the mic and read the sentence.</p>
      <div class="row">
        <button id="hear" type="button" class="secondary">🔊 Hear it</button>
        <button id="next" type="button" class="secondary" disabled>Next ➜</button>
        <button id="quit" type="button" class="secondary">Stories</button>
      </div>
    </section>

    <!-- Celebration -->
    <section id="done" class="screen" hidden>
      <div id="buddy-done">🐘🎉</div>
      <h2>You did it!</h2>
      <p id="done-summary"></p>
      <button id="again" type="button">More stories</button>
    </section>
  </div>

  <script src="stories.js"></script>
  <script src="app.js"></script>
</body>
</html>

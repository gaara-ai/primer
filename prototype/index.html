<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Primer — Reading Buddy</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>📚 Reading Buddy</h1>
      <div id="stars" title="Stars earned">⭐ <span id="star-count">0</span></div>
    </header>

    <!-- Story picker -->
    <section id="picker" class="screen">
      <h2>Pick a story!</h2>
      <div id="story-list"></div>
      <p class="hint" id="support-warning" hidden>
        ⚠️ Speech recognition needs Chrome or Edge.
      </p>
    </section>

    <!-- Reading screen -->
    <section id="reader" class="screen" hidden>
      <div id="progress-dots"></div>
      <div id="buddy">
        <div id="buddy-face">🐘</div>
        <div id="buddy-bubble" hidden></div>
      </div>
      <div id="sentence"></div>
      <p class="hint tap-hint">Tap any word to hear it 🔉</p>
      <button id="mic" type="button">🎤 Tap, then read aloud</button>
      <p class="hint" id="status">Tap the mic and read the sentence.</p>
      <div class="row">
        <button id="hear" type="button" class="secondary">🔊 Hear it</button>
        <button id="next" type="button" class="secondary" disabled>Next ➜</button>
        <button id="quit" type="button" class="secondary">Stories</button>
      </div>
    </section>

    <!-- Celebration -->
    <section id="done" class="screen" hidden>
      <div id="buddy-done">🐘🎉</div>
      <h2>You did it!</h2>
      <p id="done-summary"></p>
      <button id="again" type="button">More stories</button>
    </section>
  </div>

  <script src="stories.js"></script>
  <script src="app.js"></script>
</body>
</html>
